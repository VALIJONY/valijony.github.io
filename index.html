/* ---------------- terminal typing effect ---------------- */

function initTerminal(){
  var body = document.getElementById('terminalBody');
  if(!body) return;

  if(reduceMotion){
    body.innerHTML = TERMINAL_LINES.map(function(l){
      return '<div class="ln"><span class="prompt">$ ' + esc(l.cmd) + '</span></div><div class="ln out">' + esc(t(l.out)) + '</div>';
    }).join('');
    return;
  }

  var li = 0, ci = 0, phase = 'cmd';
  body.innerHTML = '';

  function step(){
    if(li >= TERMINAL_LINES.length){
      terminalTimer = setTimeout(function(){ body.innerHTML = ''; li = 0; ci = 0; phase = 'cmd'; step(); }, 2200);
      return;
    }
    var line = TERMINAL_LINES[li];
    var cmd = line.cmd;
    var out = t(line.out);

    if(phase === 'cmd'){
      ci++;
      renderBuffer(cmd.slice(0, ci), null);
      if(ci >= cmd.length){ phase = 'pause'; terminalTimer = setTimeout(step, 260); }
      else{ terminalTimer = setTimeout(step, 34); }
      return;
    }
    if(phase === 'pause'){
      phase = 'out';
      renderBuffer(cmd, out);
      terminalTimer = setTimeout(step, 620);
      return;
    }
    li++; ci = 0; phase = 'cmd';
    terminalTimer = setTimeout(step, 260);
  }

  function renderBuffer(cmdText, outText){
    var html = '';
    for(var i=0;i<li;i++){
      html += '<div class="ln"><span class="prompt">$ ' + esc(TERMINAL_LINES[i].cmd) + '</span></div><div class="ln out">' + esc(t(TERMINAL_LINES[i].out)) + '</div>';
    }
    html += '<div class="ln"><span class="prompt">$ ' + esc(cmdText) + '</span><span class="terminal-cursor"></span></div>';
    if(outText != null){ html += '<div class="ln out">' + esc(outText) + '</div>'; }
    body.innerHTML = html;
  }

  step();
}

/* ---------------- 3D tag sphere ---------------- */

function initSphere(){
  var stage = document.getElementById('sphereStage');
  if(!stage) return;

  var N = SPHERE_ITEMS.length;
  var golden = Math.PI * (3 - Math.sqrt(5));
  var points = [];
  for(var i=0;i<N;i++){
    var y = 1 - (i / (N - 1)) * 2;
    var r = Math.sqrt(Math.max(0, 1 - y * y));
    var theta = golden * i;
    points.push({ x: Math.cos(theta) * r, y: y, z: Math.sin(theta) * r, label: SPHERE_ITEMS[i] });
  }

  var els = points.map(function(p){
    var el = document.createElement('div');
    el.className = 'sphere-item';
    el.textContent = p.label;
    stage.appendChild(el);
    return el;
  });

  var ring1 = document.createElement('div'); ring1.className = 'sphere-ring';
  var ring2 = document.createElement('div'); ring2.className = 'sphere-ring';
  stage.insertBefore(ring1, stage.firstChild);
  stage.insertBefore(ring2, stage.firstChild);

  var core = document.createElement('div');
  core.className = 'sphere-core';
  core.textContent = 'VD';
  stage.appendChild(core);

  var angleY = 0, angleX = 0.18, t0 = null;

  function layout(){
    var w = stage.clientWidth || 320;
    var R = w * 0.36;
    var D = R * 2.6;
    var cx = w / 2, cy = (stage.clientHeight || w) / 2;

    ring1.style.width = (R * 1.64) + 'px'; ring1.style.height = (R * 1.64) + 'px';
    ring2.style.width = (R * 1.64) + 'px'; ring2.style.height = (R * 0.56) + 'px';

    return { R:R, D:D, cx:cx, cy:cy };
  }
  var dims = layout();

  function frame(ts){
    if(t0 == null) t0 = ts;
    var dt = ts - t0; t0 = ts;
    angleY += dt * 0.00025;

    var cosY = Math.cos(angleY), sinY = Math.sin(angleY);
    var cosX = Math.cos(angleX), sinX = Math.sin(angleX);

    for(var i=0;i<points.length;i++){
      var p = points[i];
      var x1 = p.x * cosY + p.z * sinY;
      var z1 = -p.x * sinY + p.z * cosY;
      var y2 = p.y * cosX - z1 * sinX;
      var z2 = p.y * sinX + z1 * cosX;

      var scale = dims.D / (dims.D + z2 * dims.R);
      var sx = dims.cx + x1 * dims.R * scale;
      var sy = dims.cy + y2 * dims.R * scale;
      var opacity = Math.max(0.28, Math.min(1, (z2 + 1.15) / 2.15));

      var el = els[i];
      el.style.transform = 'translate(-50%,-50%) translate(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px) scale(' + scale.toFixed(2) + ')';
      el.style.opacity = opacity.toFixed(2);
      el.style.zIndex = String(500 + Math.round(z2 * 100));
    }

    sphereRAF = requestAnimationFrame(frame);
  }

  if(reduceMotion){
    dims = layout();
    var cosX0 = Math.cos(angleX);
    for(var i=0;i<points.length;i++){
      var p = points[i];
      var scale = dims.D / (dims.D + p.z * dims.R);
      var sx = dims.cx + p.x * dims.R * scale;
      var sy = dims.cy + (p.y * cosX0) * dims.R * scale;
      els[i].style.transform = 'translate(-50%,-50%) translate(' + sx.toFixed(1) + 'px,' + sy.toFixed(1) + 'px) scale(' + scale.toFixed(2) + ')';
      els[i].style.opacity = '0.9';
    }
  } else {
    sphereRAF = requestAnimationFrame(frame);
  }

  window.addEventListener('resize', function(){ dims = layout(); }, { passive:true });
}
