<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Valijon Doʻsov — backend dasturchi (Python, Django, real-time, AI & hardware). Urganch, O'zbekiston.">
<meta name="theme-color" content="#0A0E13">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230A0E13%22/%3E%3Crect%20x%3D%221.5%22%20y%3D%221.5%22%20width%3D%2261%22%20height%3D%2261%22%20rx%3D%2212.5%22%20fill%3D%22none%22%20stroke%3D%22%232A3542%22%20stroke-width%3D%223%22/%3E%3Cpath%20d%3D%22M13%2017%20L25.5%2046%20L38%2017%22%20fill%3D%22none%22%20stroke%3D%22%23F2A65A%22%20stroke-width%3D%227.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Crect%20x%3D%2241%22%20y%3D%2240%22%20width%3D%2213%22%20height%3D%226.5%22%20rx%3D%222%22%20fill%3D%22%237CCFE0%22/%3E%3C/svg%3E">
<meta property="og:title" content="Valijon Doʻsov — Backend Developer">
<meta property="og:description" content="Django · DRF · Channels · Celery · real-time & AI/hardware integration">
<meta property="og:url" content="https://valijony.github.io">
<title>Valijon Doʻsov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#0A0E13;
    --bg-2:#0D1219;
    --panel:#10171F;
    --panel-2:#151E28;
    --line:rgba(150,172,198,.12);
    --line-2:rgba(150,172,198,.24);
    --ink:#E7EDF3;
    --dim:#9AA7B6;
    --faint:#5F6C7C;
    --amber:#F2A65A;
    --amber-2:#FFC48A;
    --amber-soft:rgba(242,166,90,.13);
    --cyan:#7CCFE0;
    --green:#9AD08A;
    --violet:#C4A7FF;
    --red:#F07C7C;
    --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    --sans:"Geist", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    --maxw:1160px;
    --r:10px;
  }
  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background-color:var(--bg);
    background-image:radial-gradient(rgba(150,172,198,.10) 1px, transparent 1px);
    background-size:24px 24px;
    color:var(--ink);
    font-family:var(--sans);
    font-size:15px;
    padding-inline:20px;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  @media (min-width:700px){ body{ padding-inline:32px; } }
  a{ color:inherit; text-decoration:none; }
  button, input, textarea{ font:inherit; color:inherit; }
  button{ background:none; border:0; cursor:pointer; padding:0; }
  h1,h2,h3{ margin:0; text-wrap:balance; letter-spacing:-.02em; }
  p{ margin:0; line-height:1.65; }
  .mono{ font-family:var(--mono); }
  ::selection{ background:var(--amber-soft); color:var(--ink); }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{ outline:2px solid var(--amber); outline-offset:3px; border-radius:4px; }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
  }

  .glow{ position:fixed; inset:0; pointer-events:none; z-index:0;
    background:radial-gradient(600px circle at var(--gx,70%) var(--gy,10%), rgba(242,166,90,.07), transparent 60%); }
  .shell{ position:relative; z-index:1; }
  .wrap{ max-width:var(--maxw); margin:0 auto; }

  /* ---------- topbar ---------- */
  .topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:40; margin-inline:-20px; padding-inline:20px;
    background:rgba(10,14,19,.78); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  @media (min-width:700px){ .topbar{ margin-inline:-32px; padding-inline:32px; } }
  .topbar-in{ max-width:var(--maxw); margin:0 auto; height:60px; display:flex; align-items:center; gap:20px; }
  .logo{ font-family:var(--mono); font-weight:700; font-size:14px; display:flex; align-items:center; gap:1px; white-space:nowrap; }
  .logo .p{ color:var(--cyan); }
  .logo .c{ width:8px; height:15px; background:var(--amber); margin-left:4px; animation:blink 1.1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  .nav{ display:flex; gap:4px; margin-left:auto; font-family:var(--mono); font-size:12.5px; }
  .nav a{ padding:7px 11px; border-radius:7px; color:var(--dim); transition:color .15s, background .15s; white-space:nowrap; }
  .nav a .dot-s{ color:var(--faint); }
  .nav a:hover{ color:var(--ink); background:rgba(150,172,198,.07); }
  .nav a.active{ color:var(--ink); background:rgba(150,172,198,.10); }
  .nav a.active .dot-s{ color:var(--amber); }
  .lang{ display:flex; border:1px solid var(--line-2); border-radius:8px; padding:2px; font-family:var(--mono); font-size:11px; flex:none; }
  .lang button{ padding:5px 8px; border-radius:6px; color:var(--faint); letter-spacing:.04em; }
  .lang button.on{ background:var(--ink); color:var(--bg); font-weight:700; }
  .menu-btn{ display:none; font-family:var(--mono); font-size:12px; border:1px solid var(--line-2); border-radius:8px; padding:6px 10px; color:var(--dim); }
  .mobile-nav{ max-width:var(--maxw); margin:0 auto; padding:6px 0 14px; display:grid; gap:2px; font-family:var(--mono); font-size:14px; }
  .mobile-nav a{ padding:10px 4px; color:var(--dim); border-bottom:1px solid var(--line); }
  .mobile-nav a.active{ color:var(--amber); }
  @media (max-width:820px){
    .nav{ display:none; }
    .menu-btn{ display:inline-block; margin-left:auto; }
  }

  /* ---------- generic ---------- */
  main{ min-height:70vh; }
  .page-in{ animation:pageIn .5s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes pageIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  .sec{ padding-block:72px 8px; }
  .sec-head{ display:flex; flex-direction:column; gap:10px; margin-bottom:30px; }
  .path{ font-family:var(--mono); font-size:12.5px; color:var(--cyan); }
  .path .pr{ color:var(--faint); }
  .sec-head h2{ font-size:clamp(28px,4vw,40px); font-weight:700; }
  .sec-head p{ color:var(--dim); max-width:62ch; }
  .page-top{ padding-top:56px; }
  .page-top .sec-head h2{ font-size:clamp(34px,5vw,54px); letter-spacing:-.03em; }

  .btn{ display:inline-flex; align-items:center; gap:10px; font-family:var(--mono); font-size:13px; padding:12px 18px; border-radius:9px; border:1px solid var(--line-2); transition:transform .15s, background .15s, border-color .15s, color .15s; }
  .btn:hover{ transform:translateY(-1px); }
  .btn-p{ background:var(--amber); color:#1A1206; border-color:var(--amber); font-weight:700; }
  .btn-p:hover{ background:var(--amber-2); border-color:var(--amber-2); }
  .btn-g:hover{ border-color:var(--amber); color:var(--amber-2); }
  .link-more{ display:inline-flex; gap:8px; margin-top:22px; font-family:var(--mono); font-size:13px; color:var(--amber); }
  .link-more:hover{ color:var(--amber-2); }
  .chip{ font-family:var(--mono); font-size:11px; color:var(--dim); border:1px solid var(--line); background:rgba(150,172,198,.04); border-radius:6px; padding:4px 8px; white-space:nowrap; }

  /* ---------- window chrome (vim / zsh) ---------- */
  .win{ background:var(--panel); border:1px solid var(--line-2); border-radius:12px; overflow:hidden; box-shadow:0 30px 60px -30px rgba(0,0,0,.7); }
  .win-bar{ display:flex; align-items:center; gap:7px; padding:10px 14px; background:var(--panel-2); border-bottom:1px solid var(--line); }
  .win-bar i{ width:10px; height:10px; border-radius:50%; display:block; }
  .win-bar i:nth-child(1){ background:#F07C7C; } .win-bar i:nth-child(2){ background:#F2C25A; } .win-bar i:nth-child(3){ background:#8BCB7A; }
  .win-bar span{ margin-left:8px; font-family:var(--mono); font-size:11.5px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .code{ font-family:var(--mono); font-size:12.5px; line-height:1.75; padding:14px 0; overflow:hidden; }
  .code .row{ display:flex; white-space:pre; min-height:1.75em; }
  .code .ln{ width:38px; flex:none; text-align:right; padding-right:14px; color:var(--faint); user-select:none; }
  .tk-k{ color:var(--violet); } .tk-f{ color:var(--cyan); } .tk-s{ color:var(--green); } .tk-c{ color:var(--faint); font-style:italic; } .tk-b{ color:var(--amber); } .tk-n{ color:var(--ink); }
  .caret{ display:inline-block; width:7px; height:1.2em; vertical-align:-.2em; background:var(--amber); animation:blink 1s steps(1) infinite; }
  .vim-status{ display:flex; gap:12px; align-items:center; font-family:var(--mono); font-size:11px; padding:6px 12px; border-top:1px solid var(--line); background:var(--panel-2); color:var(--dim); }
  .vim-mode{ background:var(--green); color:#0B1409; font-weight:700; padding:1px 7px; border-radius:3px; }
  .vim-mode.ins{ background:var(--amber); color:#1A1206; }
  .vim-status .sp{ margin-left:auto; }
  .term{ font-family:var(--mono); font-size:12.5px; line-height:1.75; padding:14px 16px; height:216px; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; }
  .term .l{ white-space:pre-wrap; word-break:break-word; }
  .term .pr{ color:var(--green); } .term .pr b{ color:var(--cyan); font-weight:400; }
  .term .dim{ color:var(--faint); } .term .ok{ color:var(--green); } .term .n{ color:var(--dim); } .term .am{ color:var(--amber); }

  /* ---------- hero ---------- */
  .hero{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.02fr); gap:56px; align-items:center; padding-top:64px; }
  @media (max-width:980px){ .hero{ grid-template-columns:minmax(0,1fr); gap:44px; padding-top:44px; } }
  .status{ display:inline-flex; align-items:center; gap:9px; font-family:var(--mono); font-size:12px; color:var(--green); border:1px solid rgba(154,208,138,.28); background:rgba(154,208,138,.06); padding:6px 12px; border-radius:99px; }
  .pulse{ width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 rgba(154,208,138,.6); animation:pulse 2s infinite; }
  @keyframes pulse{ 70%{ box-shadow:0 0 0 8px rgba(154,208,138,0); } 100%{ box-shadow:0 0 0 0 rgba(154,208,138,0); } }
  .greet{ margin-top:26px; font-family:var(--mono); font-size:14px; color:var(--dim); }
  .name{ font-size:clamp(46px,8.2vw,92px); font-weight:800; line-height:.94; letter-spacing:-.045em; margin-top:8px; }
  .name .ap{ color:var(--amber); }
  .typed{ margin-top:20px; font-family:var(--mono); font-size:clamp(15px,1.8vw,19px); color:var(--amber); min-height:1.6em; }
  .typed .gt{ color:var(--faint); margin-right:8px; }
  .lede{ margin-top:18px; color:var(--dim); font-size:16px; max-width:52ch; }
  .cta{ display:flex; flex-wrap:wrap; gap:12px; margin-top:30px; }
  .socials{ display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:26px; font-family:var(--mono); font-size:12.5px; }
  .socials a{ color:var(--dim); } .socials a:hover{ color:var(--amber); }
  .socials a::before{ content:"↗ "; color:var(--faint); }
  .counters{ display:grid; grid-template-columns:repeat(3,auto); justify-content:start; gap:14px 36px; margin-top:34px; padding-top:24px; border-top:1px solid var(--line); }
  .counters b{ display:block; font-family:var(--mono); font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; }
  .counters span{ display:block; margin-top:3px; font-family:var(--mono); font-size:11px; color:var(--faint); }
  @media (max-width:520px){ .counters{ grid-template-columns:repeat(2,auto); } }
  .hero-right{ position:relative; display:grid; gap:0; }
  .hero-right .win-vim{ animation:floaty 7s ease-in-out infinite alternate; }
  .hero-right .win-zsh{ margin:14px 0 0 56px; position:relative; animation:floaty 7s ease-in-out -3.5s infinite alternate; }
  @media (max-width:560px){ .hero-right .win-zsh{ margin:14px 0 0; } }
  @keyframes floaty{ from{ transform:translateY(0); } to{ transform:translateY(-8px); } }

  /* ---------- sphere ---------- */
  .stack-grid{ display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:48px; align-items:center; }
  @media (max-width:980px){ .stack-grid{ grid-template-columns:minmax(0,1fr); } }
  .sphere-wrap{ position:relative; width:100%; max-width:560px; margin:0 auto; aspect-ratio:1/1; }
  .sphere-wrap::before{ content:""; position:absolute; inset:14%; border-radius:50%; background:radial-gradient(circle, rgba(242,166,90,.10), transparent 68%); }
  .sphere-wrap canvas{ position:relative; width:100%; height:100%; display:block; cursor:grab; touch-action:pan-y; }
  .sphere-wrap canvas.dragging{ cursor:grabbing; }
  .sphere-tip{ position:absolute; pointer-events:none; transform:translate(-50%,-150%); font-family:var(--mono); font-size:12px; background:var(--ink); color:var(--bg); padding:4px 9px; border-radius:6px; white-space:nowrap; font-weight:700; }
  .sphere-hint{ position:absolute; left:50%; bottom:2%; transform:translateX(-50%); font-family:var(--mono); font-size:11px; color:var(--faint); white-space:nowrap; }
  .skills{ display:grid; gap:22px; }
  .skill-g h3{ font-family:var(--mono); font-size:12px; font-weight:500; color:var(--faint); letter-spacing:.06em; text-transform:uppercase; margin-bottom:10px; }
  .skill-g .chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .skill-g .chip{ font-size:12px; color:var(--ink); padding:6px 10px; }

  /* ---------- cards ---------- */
  .grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
  @media (max-width:980px){ .grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:640px){ .grid{ grid-template-columns:minmax(0,1fr); } }
  .card{ position:relative; display:flex; flex-direction:column; gap:12px; padding:22px; border-radius:14px; background:var(--panel); border:1px solid var(--line); overflow:hidden; transition:transform .2s, border-color .2s; }
  .card::before{ content:""; position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .25s;
    background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%), rgba(242,166,90,.10), transparent 55%); }
  .card:hover::before{ opacity:1; }
  a.card:hover{ transform:translateY(-3px); border-color:rgba(242,166,90,.45); }
  .card-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-family:var(--mono); font-size:11px; color:var(--faint); }
  .card-cat{ color:var(--cyan); }
  .card h3{ font-size:18px; font-weight:700; letter-spacing:-.01em; }
  .card p{ color:var(--dim); font-size:14px; line-height:1.6; }
  .card .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; padding-top:4px; }
  .card-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:14px; border-top:1px solid var(--line); font-family:var(--mono); font-size:11.5px; }
  .card-foot .repo{ color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card-foot .go{ color:var(--amber); flex:none; transition:transform .2s; }
  a.card:hover .card-foot .go{ transform:translate(3px,-3px); }
  .card-foot .lock{ color:var(--faint); }
  .card.hide{ display:none; }

  .toolbar{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:26px; }
  .search{ flex:1 1 240px; display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line-2); border-radius:10px; padding:0 14px; font-family:var(--mono); font-size:13px; }
  .search span{ color:var(--green); }
  .search input{ flex:1; min-width:0; background:none; border:0; outline:none; padding:12px 0; color:var(--ink); }
  .search input::placeholder{ color:var(--faint); }
  .filters{ display:flex; flex-wrap:wrap; gap:6px; }
  .f-chip{ font-family:var(--mono); font-size:12px; padding:8px 12px; border-radius:8px; border:1px solid var(--line); color:var(--dim); transition:all .15s; }
  .f-chip:hover{ color:var(--ink); border-color:var(--line-2); }
  .f-chip.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:700; }
  .group-label{ font-family:var(--mono); font-size:12px; color:var(--faint); margin:34px 0 14px; display:flex; align-items:center; gap:12px; }
  .group-label::after{ content:""; flex:1; height:1px; background:var(--line); }
  .empty{ font-family:var(--mono); color:var(--faint); padding:30px 0; }

  /* ---------- github ---------- */
  .gh-top{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:22px; }
  @media (max-width:900px){ .gh-top{ grid-template-columns:minmax(0,1fr); } }
  .profile{ display:flex; flex-direction:column; gap:18px; padding:26px; border-radius:14px; background:var(--panel); border:1px solid var(--line); }
  .profile-h{ display:flex; gap:16px; align-items:center; }
  .avatar{ width:68px; height:68px; border-radius:50%; border:2px solid var(--line-2); background:var(--panel-2); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:700; color:var(--amber); overflow:hidden; flex:none; }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .profile-h h3{ font-size:20px; }
  .profile-h .login{ font-family:var(--mono); font-size:13px; color:var(--dim); margin-top:2px; }
  .stats{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .stats div{ background:var(--bg-2); padding:14px 12px; }
  .stats b{ display:block; font-family:var(--mono); font-size:22px; font-variant-numeric:tabular-nums; }
  .stats span{ font-family:var(--mono); font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em; }
  @media (max-width:460px){ .stats{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .note{ font-family:var(--mono); font-size:11.5px; color:var(--faint); }
  .gh-console .term{ height:auto; min-height:260px; justify-content:flex-start; }

  /* ---------- timeline ---------- */
  .tl{ position:relative; display:grid; gap:18px; padding-left:28px; }
  .tl::before{ content:""; position:absolute; left:6px; top:8px; bottom:8px; width:2px; background:linear-gradient(var(--amber), var(--line)); transform-origin:top; animation:grow 1s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes grow{ from{ transform:scaleY(0); } to{ transform:none; } }
  .tl-item{ position:relative; padding:24px; border-radius:14px; background:var(--panel); border:1px solid var(--line); }
  .tl-item::before{ content:""; position:absolute; left:-28px; top:28px; width:14px; height:14px; border-radius:50%; background:var(--bg); border:2px solid var(--amber); }
  .tl-item.now::before{ background:var(--amber); box-shadow:0 0 0 5px var(--amber-soft); }
  .tl-meta{ display:flex; flex-wrap:wrap; gap:8px 16px; font-family:var(--mono); font-size:12px; color:var(--faint); }
  .tl-meta .when{ color:var(--amber); }
  .tl-item h3{ font-size:20px; margin-top:10px; }
  .tl-item .org{ color:var(--cyan); font-family:var(--mono); font-size:13px; margin-top:4px; }
  .tl-item ul{ margin:14px 0 0; padding:0; list-style:none; display:grid; gap:8px; color:var(--dim); }
  .tl-item li{ display:flex; gap:10px; line-height:1.55; }
  .tl-item li::before{ content:"›"; color:var(--amber); font-family:var(--mono); }
  .tl-item .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:16px; }
  .tl-item p{ color:var(--dim); margin-top:10px; max-width:64ch; }

  /* ---------- contact ---------- */
  .contact-grid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:22px; }
  @media (max-width:900px){ .contact-grid{ grid-template-columns:minmax(0,1fr); } }
  .c-list{ display:grid; gap:10px; align-content:start; }
  .c-item{ display:flex; align-items:center; gap:14px; padding:16px 18px; border-radius:12px; background:var(--panel); border:1px solid var(--line); transition:border-color .15s, transform .15s; }
  .c-item:hover{ border-color:rgba(242,166,90,.45); transform:translateX(3px); }
  .c-item .k{ width:78px; flex:none; font-family:var(--mono); font-size:11px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em; }

/* ================= HELPERS ================= */

var cleanups = [];
function onClean(fn){ cleanups.push(fn); }
function runClean(){ cleanups.forEach(function(f){ try{ f(); }catch(e){} }); cleanups = []; }

function route(){ var h = location.hash.replace(/^#\/?/, '').split('?')[0]; return h || 'home'; }
function secHead(path, title, lede){
  return '<div class="sec-head"><div class="path"><span class="pr">$ cd </span>~/' + esc(path) + '</div><h2>' + esc(title) + '</h2>' + (lede ? '<p>' + esc(lede) + '</p>' : '') + '</div>';
}
function catOf(p){ return CATS[p.cat] ? t(CATS[p.cat]) : ''; }
function repoPath(link){ return link ? link.replace('https://github.com/', '') : ''; }

function card(p){
  var inner =
    '<div class="card-top"><span class="card-cat">' + esc(catOf(p)) + '</span><span>' + (p.group === 'open' ? 'public' : '') + '</span></div>' +
    '<h3>' + esc(t(p.title)) + '</h3>' +
    '<p>' + esc(t(p.desc)) + '</p>' +
    '<div class="chips">' + p.stack.map(function(s){ return '<span class="chip">' + esc(s) + '</span>'; }).join('') + '</div>' +
    '<div class="card-foot">' + (p.link
      ? '<span class="repo">' + esc(repoPath(p.link)) + '</span><span class="go">↗</span>'
      : '<span class="lock">● ' + esc(t(I.priv)) + '</span>') + '</div>';
  var data = ' data-cat="' + p.cat + '" data-q="' + esc((t(p.title) + ' ' + p.stack.join(' ') + ' ' + t(p.desc)).toLowerCase()) + '"';
  return p.link
    ? '<a class="card" href="' + p.link + '" target="_blank" rel="noopener"' + data + '>' + inner + '</a>'
    : '<div class="card"' + data + '>' + inner + '</div>';
}

/* ---------- count up ---------- */
function countUp(){
  if(RM) return;
  var els = app.querySelectorAll('[data-count]');
  var start = null, raf;
  var targets = Array.prototype.map.call(els, function(el){ return +el.getAttribute('data-count'); });
  function f(ts){
    if(start == null) start = ts;
    var k = Math.min(1, (ts - start) / 900), e = 1 - Math.pow(1 - k, 3);
    Array.prototype.forEach.call(els, function(el, i){ el.textContent = Math.round(targets[i] * e); });
    if(k < 1) raf = requestAnimationFrame(f);
  }
  if(els.length){ raf = requestAnimationFrame(f); onClean(function(){ cancelAnimationFrame(raf); Array.prototype.forEach.call(els, function(el, i){ el.textContent = targets[i]; }); }); }
}

/* ---------- vim typing ---------- */
function initVim(){
  var el = document.getElementById('vim'), mode = document.getElementById('vimMode'); if(!el) return;
  var total = 0; VIM.forEach(function(line){ line.forEach(function(tk){ total += tk[1].length; }); });
  function draw(n){
    var left = n, rows = [], caretLine = 0;
    for(var li = 0; li < VIM.length; li++){
      var row = '';
      VIM[li].forEach(function(tk){
        if(left <= 0) return;
        var part = tk[1].slice(0, left);
        left -= part.length;
        if(part.length){ row += '<span class="tk-' + tk[0] + '">' + esc(part) + '</span>'; caretLine = li; }
      });
      rows.push(row);
    }
    rows[caretLine] += '<span class="caret"></span>';
    el.innerHTML = rows.map(function(r, i){ return '<div class="row"><span class="ln">' + (i + 1) + '</span>' + r + '</div>'; }).join('');
  }
  if(RM){ draw(total); if(mode){ mode.textContent = 'NORMAL'; mode.classList.remove('ins'); } return; }
  var n = 0, tm;
  draw(0);
  function step(){
    n++;
    while(flatAt(n) === ' ' && flatAt(n + 1) === ' ' && n < total){ n++; }
    draw(n);
    if(n < total){ tm = setTimeout(step, 14 + Math.random() * 26); }
    else if(mode){ mode.textContent = 'NORMAL'; mode.classList.remove('ins'); }
  }
  var flatStr = ''; VIM.forEach(function(line){ line.forEach(function(tk){ flatStr += tk[1]; }); });
  function flatAt(k){ return flatStr.charAt(k - 1); }
  tm = setTimeout(step, 500);
  onClean(function(){ clearTimeout(tm); });
}

/* ---------- zsh loop ---------- */
function initZsh(){
  var el = document.getElementById('zsh'); if(!el) return;
  var lines = [], tm;
  function prompt(cmd, caret){ return '<div class="l"><span class="pr">➜ <b>restofast</b></span> ' + esc(cmd) + (caret ? '<span class="caret"></span>' : '') + '</div>'; }
  function paint(extra){ el.innerHTML = lines.slice(-10).join('') + (extra || ''); }
  if(RM){
    ZSH.forEach(function(s){ lines.push(prompt(s.cmd)); s.out.forEach(function(o){ lines.push('<div class="l ' + o[0] + '">' + esc(o[1]) + '</div>'); }); });
    paint(prompt('', true)); return;
  }
  var si = 0;
  function runStep(){
    if(si >= ZSH.length){ tm = setTimeout(function(){ lines = []; si = 0; paint(prompt('clear', false)); tm = setTimeout(runStep, 600); }, 3200); return; }
    var s = ZSH[si], c = 0;
    (function typeCmd(){
      c++;
      paint(prompt(s.cmd.slice(0, c), true));
      if(c < s.cmd.length){ tm = setTimeout(typeCmd, 38 + Math.random() * 40); return; }
      lines.push(prompt(s.cmd));
      var oi = 0;
      (function outLine(){
        if(oi >= s.out.length){ si++; paint(prompt('', true)); tm = setTimeout(runStep, 900); return; }
        var o = s.out[oi++];
        lines.push('<div class="l ' + o[0] + '">' + esc(o[1]) + '</div>');
        paint();
        tm = setTimeout(outLine, 170 + Math.random() * 200);
      })();
    })();
  }
  paint(prompt('', true));
  tm = setTimeout(runStep, 1400);
  onClean(function(){ clearTimeout(tm); });
}

function typeScript(el, script, loopDelay){
  var tm, lines = [];
  function prompt(cmd, caret){ return '<div class="l"><span class="pr">➜ <b>~</b></span> ' + esc(cmd) + (caret ? '<span class="caret"></span>' : '') + '</div>'; }
  function paint(extra){ el.innerHTML = lines.join('') + (extra || ''); }
  if(RM){ lines.push(prompt(script.cmd)); script.out.forEach(function(o){ lines.push('<div class="l ' + o[0] + '">' + o[1] + '</div>'); }); paint(prompt('', true)); return function(){}; }
  var c = 0;
  function typeCmd(){
    c++; paint(prompt(script.cmd.slice(0, c), true));
    if(c < script.cmd.length){ tm = setTimeout(typeCmd, 30 + Math.random() * 30); return; }
    lines.push(prompt(script.cmd)); var oi = 0;
    (function out(){
      if(oi >= script.out.length){ paint(prompt('', true)); return; }
      var o = script.out[oi++]; lines.push('<div class="l ' + o[0] + '">' + o[1] + '</div>'); paint();
      tm = setTimeout(out, 110);
    })();
  }
  paint(prompt('', true));
  tm = setTimeout(typeCmd, 600);
  return function(){ clearTimeout(tm); };

/* ================= ICON SPHERE ================= */
function hexLum(h){
  var r = parseInt(h.substr(0,2),16)/255, g = parseInt(h.substr(2,2),16)/255, b = parseInt(h.substr(4,2),16)/255;
  function c(x){ return x <= .03928 ? x/12.92 : Math.pow((x+.055)/1.055, 2.4); }
  return .2126*c(r) + .7152*c(g) + .0722*c(b);
}
function initSphere(){
  var wrap = document.getElementById('sphereWrap'), cv = document.getElementById('sphere'), tip = document.getElementById('sphereTip');
  if(!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d');
  var N = ICONS.length, golden = Math.PI * (3 - Math.sqrt(5));
  var pts = ICONS.map(function(ic, i){
    var y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(1 - y*y), th = golden * i;
    var col = '#' + ic.h; if(hexLum(ic.h) < .06) col = '#E7EDF3';
    var path = null; try{ path = new Path2D(ic.p); }catch(e){}
    return { x:Math.cos(th)*r, y:y, z:Math.sin(th)*r, t:ic.t, col:col, path:path, sx:0, sy:0, s:1, zz:0 };
  });
  var W = 0, H = 0, dpr = 1;
  function size(){
    var w = wrap.clientWidth; dpr = Math.min(2, window.devicePixelRatio || 1);
    W = w; H = w; cv.width = Math.round(w * dpr); cv.height = Math.round(w * dpr);
  }
  size();
  var ax = -.25, ay = 0, vx = 0, vy = RM ? 0 : .0045, autoVy = RM ? 0 : .0045;
  var dragging = false, lx = 0, ly = 0, hover = -1, visible = true, raf = null, last = null;

  function frame(ts){
    raf = requestAnimationFrame(frame);
    if(!visible) { last = ts; return; }
    var dt = last == null ? 16 : Math.min(48, ts - last); last = ts;
    var k = dt / 16.67;
    if(!dragging){
      vy += (autoVy - vy) * .02 * k; vx += (0 - vx) * .03 * k;
      ay += vy * k; ax += vx * k;
      ax = Math.max(-1.2, Math.min(1.2, ax));
    }
    draw();
  }
  function draw(){
    var R = W * .38, cx = W/2, cy = H/2, P = 3.4;
    var cyA = Math.cos(ay), syA = Math.sin(ay), cxA = Math.cos(ax), sxA = Math.sin(ax);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);
    // guide rings
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(150,172,198,.13)';
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.stroke();
    [-.55, 0, .55].forEach(function(lat){
      var rr = Math.sqrt(1 - lat*lat) * R, oy = lat * R * cxA, ry = Math.abs(rr * sxA);
      ctx.beginPath(); ctx.ellipse(cx, cy - oy, rr, Math.max(.5, ry), 0, 0, Math.PI*2);
      ctx.strokeStyle = lat === 0 ? 'rgba(242,166,90,.22)' : 'rgba(150,172,198,.09)'; ctx.stroke();
    });
    for(var i = 0; i < pts.length; i++){
      var p = pts[i];
      var x1 = p.x*cyA + p.z*syA, z1 = -p.x*syA + p.z*cyA;
      var y2 = p.y*cxA - z1*sxA, z2 = p.y*sxA + z1*cxA;
      var s = P / (P - z2);
      p.sx = cx + x1 * R * s; p.sy = cy - y2 * R * s; p.s = s; p.zz = z2;
    }
    var order = pts.slice().sort(function(a,b){ return a.zz - b.zz; });
    var base = Math.max(18, W * .055);
    for(var j = 0; j < order.length; j++){
      var q = order[j], idx = pts.indexOf(q);
      var depth = (q.zz + 1) / 2;
      var sz = base * q.s, rad = sz * .86;
      ctx.globalAlpha = .22 + .78 * depth;
      ctx.beginPath(); ctx.arc(q.sx, q.sy, rad, 0, Math.PI*2);
      ctx.fillStyle = '#10171F'; ctx.fill();
      ctx.lineWidth = idx === hover ? 2 : 1;
      ctx.strokeStyle = idx === hover ? '#F2A65A' : 'rgba(150,172,198,' + (.12 + .2*depth) + ')'; ctx.stroke();
      if(q.path){
        ctx.save();
        var sc = (sz * .95) / 24;
        ctx.translate(q.sx - 12*sc, q.sy - 12*sc); ctx.scale(sc, sc);
        ctx.fillStyle = q.col; ctx.fill(q.path);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
  }
  function pick(mx, my){
    var best = -1, bz = -9, base = Math.max(18, W * .055);
    pts.forEach(function(p, i){
      var r = base * p.s * .86, dx = mx - p.sx, dy = my - p.sy;
      if(dx*dx + dy*dy <= r*r && p.zz > bz){ best = i; bz = p.zz; }
    });
    return best;
  }
  function local(e){ var b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; }
  function down(e){ dragging = true; cv.classList.add('dragging'); var l = local(e); lx = l[0]; ly = l[1]; vx = 0; vy = 0; try{ cv.setPointerCapture(e.pointerId); }catch(_){} }
  function move(e){
    var l = local(e);
    if(dragging){
      var dx = l[0] - lx, dy = l[1] - ly; lx = l[0]; ly = l[1];
      vy = dx * .006; vx = -dy * .006;
      ay += vy; ax = Math.max(-1.2, Math.min(1.2, ax + vx));
      if(RM) draw();
    }
    var h = pick(l[0], l[1]);
    if(h !== hover){ hover = h; if(RM) draw(); }
    if(hover >= 0 && !dragging){ tip.hidden = false; tip.textContent = pts[hover].t; tip.style.left = pts[hover].sx + 'px'; tip.style.top = (pts[hover].sy - base0()) + 'px'; }
    else tip.hidden = true;
  }
  function base0(){ return Math.max(18, W * .055) * .4; }
  function up(){ dragging = false; cv.classList.remove('dragging'); }
  function leave(){ hover = -1; tip.hidden = true; }
  cv.addEventListener('pointerdown', down);
  cv.addEventListener('pointermove', move);
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', leave);
  function onResize(){ size(); draw(); }
  window.addEventListener('resize', onResize);
  var io = null;
  if('IntersectionObserver' in window){ io = new IntersectionObserver(function(es){ visible = es[0].isIntersecting; }); io.observe(cv); }
  draw();
  if(!RM) raf = requestAnimationFrame(frame);
  onClean(function(){ if(raf) cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); if(io) io.disconnect(); });
}
